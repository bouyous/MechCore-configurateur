[package]
name = "mesh-studio"
version = "0.3.1"
edition = "2024"
authors = ["Bouyou"]
license = "MIT"
repository = "https://github.com/bouyous/MechCore-configurateur"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
